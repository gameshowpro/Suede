name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      docs_only:
        description: 'Skip the app build, only regenerate and deploy the docs site'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.resolve.outputs.app }}
      docs: ${{ steps.resolve.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'src/**'
              - 'tests/**'
              - 'packaging/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              # A change to how the application is built and packaged has to
              # run that build, or the only way to test a workflow edit is to
              # push an unrelated source change alongside it. The docs filter
              # already listed this file for the same reason.
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'README.md'
              - '.github/workflows/ci.yml'
      - name: Resolve change outputs
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.docs_only }}" == "true" ]]; then
              echo "app=false" >> $GITHUB_OUTPUT
              echo "docs=true" >> $GITHUB_OUTPUT
            else
              echo "app=true" >> $GITHUB_OUTPUT
              echo "docs=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "app=${{ steps.filter.outputs.app }}" >> $GITHUB_OUTPUT
            echo "docs=${{ steps.filter.outputs.docs }}" >> $GITHUB_OUTPUT
          fi

  # Lint and test need neither sway nor PipeWire: every compositor and audio
  # interaction sits behind a trait, exercised with recorded fixtures.
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # Proves the OpenAPI document builds with no compositor and no network,
      # which is what the docs job depends on.
      - name: OpenAPI generates standalone
        run: |
          cargo run --quiet -- openapi > /tmp/openapi.json
          python3 -c "import json;d=json.load(open('/tmp/openapi.json'));print(len(d['paths']),'paths')"

      - name: End-to-end smoke test
        run: |
          cargo build
          BIN=target/debug/suede bash scripts/smoke-test.sh

  build:
    needs: [changes, test]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.app == 'true'
    # Pinned, unlike the jobs above, because this one produces artifacts.
    # cargo-deb derives `Depends: libc6 (>= X)` from whatever glibc the build
    # host linked against, so the runner image decides the oldest system the
    # package will install on. Leaving it floating means GitHub can raise the
    # minimum supported OS without anyone touching this repository, and the
    # first sign would be an install failing in the field. Bump this
    # deliberately, and expect the floor to move when you do.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    steps:
      # Tags and full history, because the build identity comes from
      # `git describe`. A shallow clone would silently produce "unknown".
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Work out what this build is
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=v$version" >> $GITHUB_OUTPUT

          # A release build cannot recognise itself by its tag, because the
          # tag does not exist yet: the release job creates it after this one
          # finishes. Testing for it here always failed, so the first release
          # through this path labelled itself a development build sixteen
          # commits past the PREVIOUS release, which is the one thing the
          # revision exists to stop.
          #
          # The signal is the manifest being ahead of the tags. A version with
          # no tag yet, on main, is what is about to become that release.
          if [ "${{ github.event_name }}" = "push" ] \
            && [ "${{ github.ref }}" = "refs/heads/main" ] \
            && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            # A release: a plain `1`, and it calls itself by its version
            # rather than by its distance from the last one.
            revision=1
            build_id="v$version"
          elif git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            # Re-running CI on a commit that is already tagged. Same answer,
            # so a rebuild of a release produces the same package as before.
            revision=1
            build_id=$(git describe --exact-match --tags HEAD)
          else
            # After a release. The height is what makes successive builds
            # ordered: stamping the commit hash alone was tried first, and
            # dpkg compares those lexically, so roughly half the time a newer
            # build sorted below its predecessor and apt refused it as a
            # downgrade.
            height=$(git rev-list --count "$(git describe --tags --abbrev=0 --match 'v*')..HEAD" \
                     2>/dev/null || git rev-list --count HEAD)
            revision="1+${height}.g$(git rev-parse --short HEAD)"
            build_id=$(git describe --tags --always --match 'v*' || echo unknown)
          fi
          echo "revision=$revision" >> $GITHUB_OUTPUT
          echo "build_id=$build_id" >> $GITHUB_OUTPUT
          echo "::notice title=build (${{ matrix.arch }})::${build_id} packaged as ${version}-${revision}"

      - name: Install cross and cargo-deb
        run: |
          cargo install cross --locked || true
          cargo install cargo-deb --locked

      # Both architectures go through `cross`, not just aarch64.
      #
      # Building natively on the runner links against the runner's glibc, and
      # cargo-deb turns that into `Depends: libc6 (>= X)` - so the runner
      # decides the oldest system the package installs on. Measured on
      # ubuntu-24.04 that came out at 2.39, which excludes Debian 12,
      # Raspberry Pi OS Bookworm and Ubuntu 22.04: three of the platforms the
      # README names. cross builds in its own older image, so the floor comes
      # from a container we pin rather than from whatever GitHub last
      # upgraded, and both architectures get the same one.
      #
      # Suede has no native library dependencies, which is what keeps this
      # possible at all.
      - name: Build release binary
        env:
          # Stated rather than rediscovered: cross builds inside a container
          # that has neither the git history nor git itself.
          SUEDE_BUILD_ID: ${{ steps.version.outputs.build_id }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Verify the binary is self-contained
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          echo "Dynamic dependencies:"
          ldd target/${{ matrix.target }}/release/suede
          # Anything beyond libc/libm/pthread/dl means a native dependency crept in.
          if ldd target/${{ matrix.target }}/release/suede \
             | grep -vqE 'linux-vdso|ld-linux|libc\.so|libm\.so|libgcc_s|libpthread|libdl|=>.*$' ; then
            echo "unexpected dynamic dependency" && exit 1
          fi

      - name: Build .deb
        run: |
          cargo deb --no-build --target ${{ matrix.target }} \
            --deb-revision "${{ steps.version.outputs.revision }}" --output \
            suede_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb

      # The oldest system this package will install on, printed where it can
      # be seen rather than found by digging. Debian 12 and Raspberry Pi OS
      # Bookworm are 2.36; Ubuntu 22.04 is 2.35.
      #
      # Reporting must never be the thing that fails a build: the first time
      # this ran, the cross-built package carried no versioned libc6 at all,
      # grep found nothing, and `bash -e` failed a job whose build and
      # package had both succeeded - throwing away the artifact.
      - name: Report the libc floor
        run: |
          deb=$(ls suede_*_${{ matrix.arch }}.deb)
          depends=$(dpkg-deb -f "$deb" Depends)
          floor=$(echo "$depends" | grep -o 'libc6[^,]*' || echo "libc6 unversioned")
          echo "::notice title=libc floor (${{ matrix.arch }})::$floor"
          echo "$deb depends on: $depends"

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: suede-${{ matrix.arch }}
          path: suede_*.deb
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: suede-*
          merge-multiple: true

      - name: Tag the release if the version is new
        id: tag
        run: |
          tag="${{ needs.build.outputs.tag }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "Tag $tag already exists; skipping release."
            echo "new=false" >> $GITHUB_OUTPUT
          else
            git tag "$tag"
            git push origin "$tag"
            echo "new=true" >> $GITHUB_OUTPUT
          fi

      - name: Create the GitHub release
        if: steps.tag.outputs.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Suede ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: suede_*.deb
          fail_on_unmatched_files: true

  build-docs:
    needs: [changes, test]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.docs == 'true' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # Generates the API reference from the exact code being deployed, and
      # vendors the Scalar bundle so the published page needs no CDN.
      - name: Generate API reference assets
        run: bash scripts/build-docs.sh

      - name: Resolve docs version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "tag=v$version" >> $GITHUB_OUTPUT

      - name: Build the site
        env:
          SUEDE_DOCS_VERSION: ${{ steps.version.outputs.tag }}
        run: mkdocs build --strict

      # `--strict` checks links and navigation. It does not check that the
      # markdown still means anything, and it happily published a site where
      # a dependency upgrade had stopped ``` fences being recognised: every
      # code block rendered as prose, and shell comments became headings.
      # Nothing failed, because nothing was looking.
      - name: Check the markdown actually rendered
        run: |
          blocks=$(grep -ro '<pre' site --include='*.html' | wc -l)
          stray=$(grep -rho '<p>```</p>' site --include='*.html' | wc -l)
          icons=$(grep -rho ':material-[a-z-]*:' site --include='*.html' | wc -l)
          echo "code blocks: $blocks, unrendered fences: $stray, unrendered icons: $icons"
          if [ "$blocks" -lt 40 ]; then
            echo "::error::only $blocks code blocks rendered; the markdown pipeline is broken"
            exit 1
          fi
          if [ "$stray" -ne 0 ] || [ "$icons" -ne 0 ]; then
            echo "::error::literal markdown reached the published page"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-docs:
    needs: build-docs
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.build-docs.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
