[package]
name = "suede-artwork"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "suede-artwork"
path = "src/main.rs"

[dependencies]
image = { version = "=0.25.5", default-features = false, features = ["png", "ico"] }
ravif = { version = "=0.11.12", default-features = false }
resvg = { version = "=0.45.1", default-features = false }
serde_json = "1"
