site_name: Suede
# Set by scripts/tagline_hook.py: the tagline from Cargo.toml followed by
# extra.description_detail.
site_description: ""
site_url: https://suede.gameshow.pro/
repo_url: https://github.com/gameshowpro/Suede
repo_name: gameshowpro/Suede

theme:
  name: material
  font: false
  logo: generated/artwork/icon-docs.png
  favicon: generated/artwork/favicon.ico
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - generated/fonts/fonts.css
  - assets/stylesheets/extra.css

docs_dir: docs
exclude_docs: |
  overrides/
use_directory_urls: true
edit_uri: edit/main/docs/
not_in_nav: |
  generated/**
  examples/**

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Screenshots: screenshots.md
  - Configuration: configuration.md
  - Projection modes: projection-modes.md
  - System profiles: system-profiles.md
  - How it works: how-it-works.md
  - Behind a reverse proxy: reverse-proxy.md
  - Multiple clients: multi-user.md
  - Unreal Engine: unreal-engine.md
  # A static file, not a page: Scalar is built to own a viewport, so the
  # reference is served outside the theme rather than squeezed into its
  # content column. MkDocs copies it through verbatim.
  - API reference: api/index.html
  - Troubleshooting: troubleshooting.md
  - Maintenance fee: maintenance-fee.md
  - Developer:
      - Architecture: developer/architecture.md
      - GPU timing: developer/gpu-timing.md
      - VK_KHR direct display: developer/vk-khr.md
      - Test systems: developer/test-systems.md
      - Deployment: developer/deployment.md
      - Versioning: developer/versioning.md
      - Specification: specification.md
      - Plans:
          - Overview: plans/index.md
          - Black lift: plans/black-offset.md
          - Direct-to-Display (VK_KHR_display): plans/VK_KHR_display.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  # The home page's feature grid uses Material's icon shortcodes
  # (`:material-web:`), which are ordinary text without this.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Superfences delegates the actual highlighting here; without it, code
  # blocks render but every one of them is unstyled plain text.
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

hooks:
  - scripts/artwork_hook.py
  - scripts/fonts_hook.py
  - scripts/tagline_hook.py

watch:
  - artwork
  - scripts/artwork
  - fonts
  - Cargo.toml

extra:
  # extra.tagline is filled in from Cargo.toml by scripts/tagline_hook.py.
  description_detail: Configure outputs, route audio, supervise kiosk browsers, project onto overlapping and warped surfaces, and survive reboots.
  version: !ENV [SUEDE_DOCS_VERSION, "dev"]
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gameshowpro/Suede
      name: GitHub Repository
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/gameshowpro?metadata_project=suede&metadata_source=docs-footer
      name: Sponsor on GitHub
    - icon: fontawesome/brands/paypal
      link: https://paypal.me/barjonas
      name: Donate via PayPal

# Material renders HTML here. The link is absolute because this text is
# copied verbatim into every page, where a relative one would resolve
# against that page's own directory.
copyright: '© 2026 Barjonas LLC · MPL-2.0 · <a href="https://suede.gameshow.pro/maintenance-fee/">Maintenance fee</a>'
