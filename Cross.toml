# `cross` runs the compiler inside a container and passes only a fixed set of
# variables into it. This asks for one more.
#
# It is not what the build relies on. Adding this alone did not fix the
# identity problem it was written for - the released binary still called
# itself `unknown` - so `.build-id` in the workspace carries the answer
# instead, by the same route the source itself takes. This stays because it
# costs nothing and takes precedence when it does work, but anything that
# depends on the identity should assume the file is what delivered it.
[build.env]
passthrough = ["SUEDE_BUILD_ID"]
