[package]
name = "suede"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
description = "Remote management daemon for Sway-based display appliances"
authors = ["Hamish Barjonas"]
license = "PolyForm-Small-Business-1.0.0"
repository = "https://github.com/gameshowpro/Suede"
readme = "README.md"
default-run = "suede"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "tokio", "http1"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Projection (edge blending) support files that build everywhere; the
# Wayland stack itself is Unix-only and declared under the target below.
tempfile = { version = "3", optional = true }

[features]
# Projection ships by default; packagers who do not need it can build with
# `--no-default-features`. The configuration schema is NOT feature-gated —
# a build without the machinery still parses, stores, and serves projection
# settings, and reports a divergence if asked to blend.
default = ["projection"]
projection = [
    "dep:memmap2",
    "dep:tempfile",
    "dep:wayland-client",
    "dep:wayland-protocols",
    "dep:wayland-protocols-wlr",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Pure-Rust Wayland stack, so the single self-contained ELF invariant holds;
# no libwayland is linked. The overlay client only exists on Unix — on other
# hosts the `projection` feature still compiles the math and the manager, so
# the cross-platform test suite covers them.
memmap2 = { version = "0.9", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Packaging is driven entirely from here; there is no separate packaging tree
# to keep in step. Build with `cargo deb`.
[package.metadata.deb]
maintainer = "Hamish Barjonas <suede@gameshow.pro>"
copyright = "2026, Barjonas LLC"
license-file = ["LICENSE", "0"]
extended-description = """\
Suede turns a Linux box running the sway compositor into a remotely manageable \
display appliance. It exposes a documented REST and SSE API for configuring \
video outputs, routing audio, and supervising kiosk browsers, and it persists \
that configuration so the machine boots straight back into its configured \
state without operator intervention."""
section = "video"
priority = "optional"
# swayidle: the daemon never runs it, but the sway config provisioning writes
# relies on it to keep displays awake, and Debian's sway only Suggests it.
depends = "$auto, sway, swayidle, pipewire, pipewire-pulse"
# No browser relationship at all. Suede does not link against a browser or
# name one at build time: it resolves whichever of several binaries it finds
# at launch, and says plainly when it finds none. Declaring them here only
# claimed a coupling that does not exist, and cost real damage doing it - as
# a Recommends it installed a snap Chromium on Ubuntu, where `chromium` is a
# transitional package, onto a machine that already had a browser. The names
# differ per distribution anyway (Debian has a real `chromium` deb and no
# snap; `google-chrome-stable` is in no distribution's archive), so any list
# here would be wrong somewhere.
maintainer-scripts = "packaging"
assets = [
    ["target/release/suede", "usr/bin/", "755"],
    ["packaging/suede.service", "usr/lib/systemd/user/", "644"],
    ["packaging/provision.sh", "usr/share/suede/", "755"],
    ["packaging/reset-machine.sh", "usr/share/suede/", "755"],
    ["README.md", "usr/share/doc/suede/README.md", "644"],
    ["docs/examples/suede.toml", "usr/share/doc/suede/examples/suede.toml", "644"],
    ["docs/examples/four-output-appliance.json", "usr/share/doc/suede/examples/four-output-appliance.json", "644"],
]
