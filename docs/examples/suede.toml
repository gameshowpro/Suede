# Suede bootstrap configuration.
#
# Copy to $XDG_CONFIG_HOME/suede/suede.toml (usually ~/.config/suede/suede.toml).
# Every value here can be overridden by the matching SUEDE_* environment
# variable, which wins.
#
# This file holds only what must be known *before* the API can serve.
# Everything else — outputs, applications, audio routing — is desired state,
# written through the API and persisted separately.

# Address the HTTP server binds to.  Env: SUEDE_BIND
bind = "0.0.0.0:9088"

# Optional bearer token.  Env: SUEDE_TOKEN
#
# Leave unset on a trusted production LAN, which is the expected deployment.
# Setting it requires `Authorization: Bearer <token>` on every endpoint except
# /healthz and the loopback-only heartbeat endpoint — and disables the
# reference web UI, which could not embed the token without exposing it.
# token = "change-me"

# Where the desired-state document is persisted.  Env: SUEDE_STATE_DIR
# Defaults to $XDG_STATE_HOME/suede (usually ~/.local/state/suede).
# state_dir = "/var/lib/suede"

# Base URL used to build documentation links in health checks.
# Env: SUEDE_DOCS_BASE_URL
docs_base_url = "https://suede.gameshow.pro/"

# Host power operations this appliance may perform.  Env: SUEDE_POWER
# (comma-separated, e.g. SUEDE_POWER=reboot,poweroff)
#
# Empty by default: a display appliance should not be able to turn itself
# off because somebody found the button. This is a declaration of intent,
# not a security boundary, and it lives here rather than in desired state
# because desired state is writable through the very API this permission
# would otherwise be meant to constrain. See configuration.md#host-power.
# power = ["reboot"]

# Programs applications are permitted to launch.  Env: SUEDE_ALLOWED_PROGRAMS
# (comma-separated, e.g. SUEDE_ALLOWED_PROGRAMS=chromium,firefox)
#
# Defaults to the browsers Suede knows how to drive, so a stock appliance
# runs kiosk pages and nothing else. Matching is on the program's file name,
# so a path works the same as a bare name. `["*"]` lifts the restriction
# entirely; an empty list permits nothing, which is a legitimate way to
# freeze a machine. Lives here rather than in desired state for the same
# reason `power` does: desired state is writable through the very API this
# is meant to constrain. See configuration.md#allowed-programs.
# allowed_programs = ["chromium", "google-chrome-stable"]

# Whether outputs may overlap in canvas space.
#
# Left false, sway tiles the layout itself and a write whose output rectangles
# intersect is rejected; the compositor must run with
# WLR_SCENE_DISABLE_DIRECT_SCANOUT=1 or a spanned window mirrors on some
# drivers. Set true, every layout of two or more outputs goes through the
# slicer instead — each display scans out its own buffer, so that variable
# must *not* be set. `provision.sh --allow-overlaps` configures both halves.
# See configuration.md#direct-scanout.
# allow_overlaps = false
